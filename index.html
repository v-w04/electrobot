<!-- Registro del Service Worker — habilita instalación y modo offline -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('service-worker.js')
        .then(function(reg) {
          console.log('✅ Service Worker registrado:', reg.scope);
          reg.addEventListener('updatefound', function() {
            const sw = reg.installing;
            if (sw) sw.addEventListener('statechange', function() {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('🔄 Nueva versión disponible — recarga para aplicar');
              }
            });
          });
        })
        .catch(function(err) {
          console.warn('⚠️ Service Worker no se pudo registrar:', err);
        });
    });
  }
</script>

<style>
/* ============================================================
   SISTEMA DE DISEÑO — clavado a Styles.css de la intranet
   ============================================================ */
:root {
  /* ── Paleta BMW adaptada + tonos azules profundos ──────────
     BMW Blue como acento, pero las superficies oscuras tienen
     tinte azul (no negro plano) para dar profundidad visual.
     Sin rojo M — solo azules. */
  --primary:         #1c69d4;       /* BMW Blue — color de acción */
  --primary-dark:    #0653b6;       /* pressed/hover */
  --primary-soft:    rgba(28, 105, 212, 0.14);
  --secondary:       #2563EB;       /* azul ligeramente más vivo para acentos secundarios */

  --success:         #22c55e;
  --warning:         #f59e0b;
  --danger:          #dc2626;

  /* Superficies con tinte azul (no negro plano). El gradiente del body
     hace toda la diferencia visual entre estos tonos. */
  --bg-primary:      #0E1726;       /* azul navy profundo, base del body */
  --bg-secondary:    #15233A;       /* azul medio para topbar/sidebar/cards grandes */
  --bg-tertiary:     #1B2B47;       /* azul un paso arriba para hover/elevated */
  --bg-card:         #15233A;

  /* Texto */
  --text-primary:    #ffffff;
  --text-secondary:  #BBC7DA;       /* gris-azulado en lugar de gris puro */
  --text-muted:      #8A94A8;

  /* Hairlines azuladas */
  --border-color:    rgba(99, 152, 232, 0.14);
  --border-strong:   rgba(99, 152, 232, 0.28);

  /* BMW token radius — recuperamos esquinas tipo macOS */
  --radius-card:     12px;
  --radius-button:   10px;
  --radius-input:    10px;
  --radius-pill:     999px;

  --fs: 1.35;
}

/* ════════════════════════════════════════════════════════════════
   OVERRIDES DE ESTILO
   Adoptamos lo que SÍ funciona del sistema BMW:
   - Tipografía display 700 + body 300 (firma editorial)
   - Botones planos con BMW Blue (no gradientes coloridos)
   - "LEARN MORE"-style links uppercase con tracking
   Recuperamos lo que pertenece al sistema actual:
   - Esquinas redondeadas tipo macOS (~10-14px)
   - Fondo con depth visual (gradiente azul)
   - Sin rojo M (solo azules)
   ════════════════════════════════════════════════════════════════ */

/* Botones primarios: BMW Blue plano, sin gradiente */
.send-btn,
.mobile-menu-btn {
  background: var(--primary) !important;
  border: none !important;
  box-shadow: 0 4px 12px rgba(28, 105, 212, 0.30) !important;
}
.send-btn:hover,
.mobile-menu-btn:hover {
  background: var(--primary-dark) !important;
  box-shadow: 0 6px 16px rgba(28, 105, 212, 0.42) !important;
}

/* Tipografía display BMW — pesada para títulos */
.welcome-title,
.logo-text h1,
.modal-title,
.sheet-title,
.nav-title,
.topbar h2 {
  font-weight: 700 !important;
  letter-spacing: 0 !important;
}

/* Tipografía body BMW — ligera 300 para texto secundario.
   NO se aplica a .msg-bubble (las burbujas de chat necesitan peso
   normal para legibilidad de listas largas con datos). */
.welcome-subtitle,
.logo-text p,
.suggestion .sg-sub {
  font-weight: 300 !important;
}

/* Links UPPERCASE estilo "LEARN MORE" — usados en el header de Atajos */
.atajos-header > span,
.atajos-section-label {
  text-transform: uppercase !important;
  letter-spacing: 1.5px !important;
  font-weight: 700 !important;
}

/* Scrollbars sutiles azulados */
*::-webkit-scrollbar-thumb { background: var(--border-strong) !important; }
*::-webkit-scrollbar-thumb:hover { background: var(--primary) !important; }

* { margin: 0; padding: 0; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }

*:not(.fa):not(.fas):not(.far):not(.fab):not(.fal):not([class*="fa-"]),
*:not(.fa):not(.fas):not(.far):not(.fab):not(.fal):not([class*="fa-"])::before,
*:not(.fa):not(.fas):not(.far):not(.fab):not(.fal):not([class*="fa-"])::after {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
}
.fa, .fas, .far, .fab, .fal, [class*="fa-"] {
  font-family: 'Font Awesome 6 Free' !important;
}
.fa, .fas, [class*="fa-"] { font-weight: 900 !important; }

html { background: var(--bg-primary); min-height: 100vh; }
body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  /* Gradiente diagonal azul navy → azul medio. Recupera la profundidad
     visual que un fondo plano perdía. El tono está más cargado a azul
     que antes (no negro grisáceo). */
  background: linear-gradient(135deg, #0E1726 0%, #16243D 50%, #1B2B47 100%) !important;
  background-attachment: fixed !important;
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ============================================================
   PARTÍCULAS FLOTANTES — Azul BMW vivo
   ============================================================ */
#particles {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.particle {
  position: absolute; width: 3px; height: 3px;
  /* BMW Blue con buen brillo para que se vean sobre el gradiente */
  background: rgba(56, 130, 246, 0.75);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(56, 130, 246, 0.65);
  will-change: transform, opacity; transform: translateZ(0);
}
@keyframes floatOrganic1 {
  0% { transform: translate(0, 100vh) scale(0); opacity: 0; }
  5% { opacity: 1; transform: translate(0, 95vh) scale(1); }
  25% { transform: translate(15px, 70vh) scale(1.1); }
  50% { transform: translate(-20px, 45vh) scale(0.9); }
  75% { transform: translate(30px, 20vh) scale(1.2); }
  95% { opacity: 1; transform: translate(10px, 5vh) scale(1); }
  100% { transform: translate(0, 0) scale(0); opacity: 0; }
}
@keyframes floatOrganic2 {
  0% { transform: translate(0, 100vh) scale(0) rotate(0deg); opacity: 0; }
  5% { opacity: 1; transform: translate(0, 95vh) scale(1) rotate(45deg); }
  30% { transform: translate(-25px, 65vh) scale(1.2) rotate(120deg); }
  60% { transform: translate(40px, 35vh) scale(0.8) rotate(240deg); }
  85% { transform: translate(-15px, 10vh) scale(1.1) rotate(320deg); }
  95% { opacity: 1; transform: translate(5px, 3vh) scale(1) rotate(360deg); }
  100% { transform: translate(0, 0) scale(0) rotate(360deg); opacity: 0; }
}
@keyframes floatOrganic3 {
  0% { transform: translate(0, 100vh) scale(0); opacity: 0; }
  8% { opacity: 1; transform: translate(0, 92vh) scale(1); }
  35% { transform: translate(35px, 60vh) scale(0.9); }
  55% { transform: translate(-30px, 40vh) scale(1.3); }
  80% { transform: translate(20px, 15vh) scale(0.95); }
  95% { opacity: 1; transform: translate(-5px, 5vh) scale(1); }
  100% { transform: translate(0, 0) scale(0); opacity: 0; }
}

/* ============================================================
   SCROLLBAR GLOBAL
   ============================================================ */
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 3px; }
*::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #3B82F6, #06B6D4); border-radius: 3px; }
*::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #2563EB, #0284C7); }
* { scrollbar-width: thin; scrollbar-color: #3B82F6 rgba(15, 23, 42, 0.5); }

/* ============================================================
   LAYOUT — sidebar + main content (idéntico a intranet)
   ============================================================ */
.app-container {
  display: flex; height: 100vh; height: 100dvh; position: relative; z-index: 1; overflow: visible;
}

.sidebar {
  width: 340px;
  /* Fondo azul oscuro con leve transparencia para mostrar partículas detrás */
  background: rgba(15, 25, 45, 0.96);
  border-right: 1px solid var(--border-color);
  padding: 24px;
  overflow-y: auto; overflow-x: hidden;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  height: 100vh; max-height: 100vh;
  position: fixed; top: 0; left: 0; z-index: 200;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

/* Logo */
.logo-container {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 32px; padding-bottom: 24px;
  border-bottom: 1px solid var(--border-color) !important;
}
.logo-img {
  width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--primary) !important;
  cursor: pointer; transition: opacity 0.2s;
  animation: logoBreathing 5s ease-in-out infinite;
}
.logo-img:hover { opacity: 0.8; animation-play-state: paused; }
@keyframes logoBreathing {
  0%, 100% {
    box-shadow: 0 0 8px rgba(59, 130, 246, 0.4), 0 0 16px rgba(59, 130, 246, 0.2);
    border-color: rgba(59, 130, 246, 0.8); transform: scale(1);
  }
  50% {
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.6), 0 0 32px rgba(59, 130, 246, 0.3), 0 0 48px rgba(59, 130, 246, 0.1);
    border-color: rgba(59, 130, 246, 1); transform: scale(1.05);
  }
}
body.girly-mode .logo-img {
  border-color: #BA8FFF !important;
  animation: logoBreathingGirly 5s ease-in-out infinite;
}
@keyframes logoBreathingGirly {
  0%, 100% {
    box-shadow: 0 0 8px rgba(186, 143, 255, 0.4), 0 0 16px rgba(186, 143, 255, 0.2);
    border-color: rgba(186, 143, 255, 0.8); transform: scale(1);
  }
  50% {
    box-shadow: 0 0 16px rgba(186, 143, 255, 0.6), 0 0 32px rgba(186, 143, 255, 0.3), 0 0 48px rgba(219, 112, 147, 0.2);
    border-color: rgba(186, 143, 255, 1); transform: scale(1.05);
  }
}
.logo-text h1 { font-size: calc(18px * var(--fs)); font-weight: 700; color: var(--text-primary); }
.logo-text p  { font-size: calc(12px * var(--fs)); color: var(--text-secondary); }

/* Botones del sidebar (mismo patrón que topbar-btn de la intranet) */
.sidebar-controls {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-bottom: 20px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border-color);
}
.topbar-btn {
  padding: 12px 16px;
  background: rgba(59, 130, 246, 0.1);
  border: 1px solid var(--primary) !important;
  border-radius: 8px;
  color: var(--primary);
  cursor: pointer;
  transition: all 0.2s;
  font-size: calc(14px * var(--fs)); font-weight: 600;
}
.topbar-btn:hover {
  background: var(--primary); color: white;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}
.topbar-btn.small { padding: 10px; font-size: calc(13px * var(--fs)); }

/* Botón Instalar PWA */
.install-btn {
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--success), #059669);
  border: none !important;
  border-radius: 8px;
  color: white;
  font-weight: 700;
  font-size: calc(13px * var(--fs));
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.3s;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
}
.install-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
}
.install-btn i { font-size: calc(16px * var(--fs)); }
body.girly-mode .install-btn {
  background: linear-gradient(135deg, #BA8FFF, #DB7093);
}
body.girly-mode .install-btn:hover {
  box-shadow: 0 4px 12px rgba(186, 143, 255, 0.5);
}

/* Live time indicator */
.live-indicator {
  padding: 12px;
  margin-bottom: 16px;
  background: rgba(59, 130, 246, 0.1);
  border-radius: 8px;
  border-left: 3px solid var(--primary);
  display: flex; align-items: center; gap: 8px;
}
.pulse-indicator {
  width: 8px; height: 8px;
  background: var(--primary);
  border-radius: 50%; position: relative;
  animation: livePulse 2s ease-in-out infinite;
}
.pulse-indicator::before {
  content: ''; position: absolute;
  width: 100%; height: 100%; border-radius: 50%;
  background: var(--primary);
  animation: ripple 2s ease-out infinite;
}
@keyframes livePulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.8; }
}
@keyframes ripple {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(3); opacity: 0; }
}
body.girly-mode .pulse-indicator,
body.girly-mode .pulse-indicator::before { background: #BA8FFF; }
.live-indicator-label {
  font-size: calc(11px * var(--fs)); color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.live-indicator-value {
  font-size: calc(13px * var(--fs)); color: var(--primary); font-weight: 600;
}

/* Navegación del sidebar */
/* Bloques del sidebar — cada sección queda visualmente separada de la
   anterior con una línea divisoria sutil (degradado que se desvanece a los
   bordes). El título tiene una barrita de color azul a la izquierda que
   ayuda a delimitarlo del bloque anterior. */
.nav-section {
  margin-bottom: 18px;
  padding-bottom: 18px;
  border-bottom: 1px solid transparent;
  /* Línea divisoria estilo "fade out" en los bordes */
  border-image: linear-gradient(
    90deg,
    transparent 0%,
    rgba(56, 189, 248, 0.18) 20%,
    rgba(56, 189, 248, 0.18) 80%,
    transparent 100%
  ) 1;
}
/* La última sección no necesita línea inferior (no hay nada después) */
.nav-section:last-child {
  border-bottom: none;
  margin-bottom: 8px;
  padding-bottom: 8px;
}
.nav-title {
  font-size: calc(10px * var(--fs));
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-primary);
  margin-bottom: 10px;
  padding: 4px 12px 4px 14px;
  opacity: 0.92;
  /* Barrita de color azul a la izquierda del título */
  border-left: 3px solid var(--primary);
  background: linear-gradient(
    90deg,
    rgba(56, 189, 248, 0.10) 0%,
    rgba(56, 189, 248, 0.02) 60%,
    transparent 100%
  );
  border-radius: 0 6px 6px 0;
}
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 8px; cursor: pointer;
  transition: all 0.18s; margin-bottom: 3px;
  color: var(--text-secondary);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  font-size: calc(13.5px * var(--fs));
}
.nav-item:hover {
  background: rgba(59, 130, 246, 0.1);
  color: var(--primary);
  transform: translateX(3px);
}
.nav-item.active {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}
.nav-item i {
  font-size: calc(14px * var(--fs)); width: 18px; text-align: center;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ============================================================
   MAIN CONTENT — donde antes iba el dashboard, ahora va el chat
   ============================================================ */
.main-content {
  flex: 1;
  margin-left: 0;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Topbar (igual que intranet) */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  margin: 20px 24px 16px;
  padding: 14px 20px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color) !important;
  /* Esquinas tipo macOS */
  border-radius: 14px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  animation: slideInUp 0.6s ease-out both;
}
/* Acento superior — gradiente AZUL (sin rojo). De azul claro a BMW Blue
   profundo. Solo en el topbar como guiño marca. */
.topbar::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(
    90deg,
    var(--secondary) 0%,
    var(--primary)  50%,
    var(--primary-dark) 100%
  );
  pointer-events: none;
}
@keyframes slideInUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.bot-avatar {
  width: 40px; height: 40px;
  /* Esquinas redondeadas tipo macOS */
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  display: flex; align-items: center; justify-content: center;
  font-size: calc(18px * var(--fs)); color: white;
  /* Glow azul */
  box-shadow: 0 4px 14px rgba(28, 105, 212, 0.35);
  flex-shrink: 0;
}
.topbar-left h2 { font-size: calc(18px * var(--fs)); font-weight: 700; margin-bottom: 2px; }
.topbar-left p { color: var(--text-secondary); font-size: calc(12px * var(--fs)); display: flex; align-items: center; gap: 6px; }
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
  animation: livePulse 2s ease-in-out infinite;
}
.topbar-actions { display: flex; gap: 10px; }

/* Chat area */
.chat-frame {
  flex: 1;
  min-height: 0;
  margin: 0 24px 20px;
  background: rgba(21, 35, 58, 0.6);
  border: 1px solid var(--border-color) !important;
  border-radius: 14px;
  overflow: hidden;
  display: flex; flex-direction: column;
  animation: slideInUp 0.6s ease-out 0.1s both;
}

.chat-main {
  flex: 1;
  overflow-y: auto; overflow-x: hidden;
  padding: 24px 24px 20px;
  scroll-behavior: smooth;
}

.chat-container {
  width: 100%;
  max-width: 1500px; margin: 0 auto;
  display: flex; flex-direction: column;
  gap: 14px;
}

/* Welcome inicial — MSN / Frutiger Aero */
.welcome-card {
  text-align: center;
  padding: 28px 16px 28px;
  min-height: 100%;
  display: flex; flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  animation: slideInUp 0.6s ease-out 0.2s both;
}
/* Slot que recibe el composer en la pantalla de bienvenida */
#composer-slot-welcome {
  width: 100%;
  max-width: 760px;
  margin: 0 auto 18px;
}
#composer-slot-welcome:empty { display: none; }
/* Cuando el composer-inner vive dentro del welcome, se ve como una caja
   destacada (input prominente, no como barra inferior). */
#composer-slot-welcome .composer-inner {
  max-width: 100%;
  padding: 0;
}
#composer-slot-welcome .composer-input-wrap {
  background: rgba(15, 23, 42, 0.75);
  border: 1px solid rgba(56, 189, 248, 0.4) !important;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
}
/* Composer de abajo oculto durante la bienvenida */
.composer.hidden { display: none; }
/* Ajuste de scroll en welcome cuando el composer está arriba: el chat-main
   puede scrollear todo el welcome si los atajos no caben. */
body.composer-on-top .chat-main { padding-bottom: 16px; }
/* Avatar del bot con borde brillante tipo MSN */
.welcome-avatar {
  width: 84px; height: 84px;
  margin: 0 auto 16px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(40px * var(--fs));
  background:
    radial-gradient(circle at 35% 28%, rgba(255,255,255,0.30), transparent 55%),
    linear-gradient(135deg, #15233A, #0E1726);
  border: 2px solid rgba(56, 130, 246, 0.55);
  /* Glow azul vivo */
  box-shadow:
    0 0 0 4px rgba(28, 105, 212, 0.14),
    0 0 28px rgba(56, 130, 246, 0.45),
    inset 0 2px 8px rgba(255,255,255,0.10);
  animation: avatarGlow 3.5s ease-in-out infinite;
  position: relative;
}
@keyframes avatarGlow {
  0%, 100% { box-shadow: 0 0 0 4px rgba(28,105,212,0.14), 0 0 22px rgba(56,130,246,0.40), inset 0 2px 8px rgba(255,255,255,0.10); }
  50%      { box-shadow: 0 0 0 5px rgba(28,105,212,0.22), 0 0 38px rgba(56,130,246,0.65), inset 0 2px 10px rgba(255,255,255,0.15); }
}
.welcome-emoji {  /* compat: por si queda algún emoji suelto */
  font-size: calc(40px * var(--fs));
}
.welcome-title {
  font-size: calc(23px * var(--fs)); font-weight: 700;
  margin-bottom: 6px; color: var(--text-primary);
  letter-spacing: 0.2px;
}
.welcome-subtitle {
  color: var(--text-secondary);
  font-size: calc(13px * var(--fs)); margin-bottom: 26px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}
/* Header arriba de los atajos: etiqueta + botón "Nuevos" para regenerar al azar */
.suggestions-header {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; max-width: 1200px;
  margin: 4px auto 12px;
  padding: 0 4px;
}
.suggestions-label {
  font-size: calc(12px * var(--fs));
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.refresh-atajos-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px;
  background: linear-gradient(135deg, rgba(56,189,248,0.18), rgba(30,41,59,0.55));
  border: 1px solid rgba(56, 189, 248, 0.40) !important;
  border-radius: 10px;
  color: var(--text-primary);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  font-size: calc(11.5px * var(--fs)); font-weight: 600;
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}
.refresh-atajos-btn:hover {
  background: linear-gradient(135deg, rgba(56,189,248,0.28), rgba(30,41,59,0.7));
  border-color: rgba(56,189,248,0.65) !important;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(56,189,248,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
}
.refresh-atajos-btn:active { transform: translateY(0) scale(0.97); }
.refresh-atajos-btn i { font-size: calc(11px * var(--fs)); }
/* Animación de giro al refrescar */
.refresh-atajos-btn.spinning i {
  animation: spinIcon 0.5s ease-out;
}
@keyframes spinIcon {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
/* Tarjetas de atajo — Plate con tinte azul, esquinas macOS.
   Sin glossy ni glow excesivo. Hover sube ligeramente a un tono
   azul más vivo. */
.suggestion {
  position: relative;
  min-height: 68px;
  background: linear-gradient(180deg, rgba(28, 105, 212, 0.10), rgba(21, 35, 58, 0.65));
  border: 1px solid var(--border-color) !important;
  border-radius: 12px;
  padding: 16px 18px;
  text-align: left;
  color: var(--text-primary);
  cursor: pointer;
  overflow: hidden;
  transition: background 0.2s, border-color 0.2s, transform 0.18s;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  display: flex; align-items: center; gap: 15px;
  animation: slideInUp 0.4s ease-out backwards;
  -webkit-tap-highlight-color: transparent;
}
.suggestion:hover {
  background: linear-gradient(180deg, rgba(28, 105, 212, 0.18), rgba(27, 43, 71, 0.85));
  border-color: var(--border-strong) !important;
  transform: translateY(-1px);
}
.suggestion:active {
  background: var(--primary-soft);
  border-color: var(--primary) !important;
  transform: translateY(0);
}
.suggestion::before { display: none; }

/* Icono del atajo: gradiente azul, redondeo macOS */
.suggestion .sg-icon {
  flex-shrink: 0;
  width: 46px; height: 46px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(18px * var(--fs)); color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  box-shadow: 0 3px 10px rgba(28, 105, 212, 0.35);
}
.suggestion .sg-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.suggestion .sg-title {
  font-size: calc(13.5px * var(--fs));
  font-weight: 700;
  line-height: 1.25;
}
.suggestion .sg-sub {
  font-size: calc(11px * var(--fs));
  font-weight: 300;
  color: var(--text-secondary);
  line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.suggestion:nth-child(1) { animation-delay: 0.28s; }
.suggestion:nth-child(2) { animation-delay: 0.33s; }
.suggestion:nth-child(3) { animation-delay: 0.38s; }
.suggestion:nth-child(4) { animation-delay: 0.43s; }
.suggestion:nth-child(5) { animation-delay: 0.48s; }
.suggestion:nth-child(6) { animation-delay: 0.53s; }
.suggestion:nth-child(7) { animation-delay: 0.58s; }
.suggestion:nth-child(8) { animation-delay: 0.63s; }
.suggestion:nth-child(9) { animation-delay: 0.68s; }
.suggestion:nth-child(10){ animation-delay: 0.73s; }
.suggestion:nth-child(11){ animation-delay: 0.78s; }
.suggestion:nth-child(12){ animation-delay: 0.83s; }
.suggestion:nth-child(13){ animation-delay: 0.88s; }
.suggestion:nth-child(14){ animation-delay: 0.93s; }
.suggestion:nth-child(15){ animation-delay: 0.98s; }
.suggestion:nth-child(16){ animation-delay: 1.03s; }
.suggestion:nth-child(17){ animation-delay: 1.08s; }
.suggestion:nth-child(18){ animation-delay: 1.13s; }
.suggestion:nth-child(19){ animation-delay: 1.18s; }
.suggestion:nth-child(20){ animation-delay: 1.23s; }
.suggestion:hover {
  transform: translateY(-3px);
  border-color: rgba(56,189,248,0.6) !important;
  background: linear-gradient(180deg, rgba(56,189,248,0.18), rgba(30,41,59,0.65));
  box-shadow: 0 8px 22px rgba(56,189,248,0.30), inset 0 1px 0 rgba(255,255,255,0.14);
}
.suggestion:active { transform: translateY(-1px) scale(0.985); }

/* Variante: atajo de GUÍA — se distingue visualmente del atajo "ejecuta ya".
   Acento púrpura para diferenciarlo del azul de los atajos de consulta. */
.suggestion-guide {
  background: linear-gradient(180deg, rgba(167,139,250,0.10), rgba(30,41,59,0.55));
  border-color: rgba(167, 139, 250, 0.32) !important;
}
.suggestion-guide .sg-icon {
  background: linear-gradient(135deg, #8B5CF6, #A78BFA);
  box-shadow: 0 3px 8px rgba(167,139,250,0.45), inset 0 1px 2px rgba(255,255,255,0.4);
}
.suggestion-guide:hover {
  border-color: rgba(167,139,250,0.65) !important;
  background: linear-gradient(180deg, rgba(167,139,250,0.18), rgba(30,41,59,0.65));
  box-shadow: 0 8px 22px rgba(167,139,250,0.30), inset 0 1px 0 rgba(255,255,255,0.14);
}

/* Burbuja de GUÍA — mensaje del bot con explicación + ejemplos + filtros */
.guide-bubble {
  background: linear-gradient(180deg, rgba(167,139,250,0.10), rgba(30,41,59,0.7)) !important;
  border: 1px solid rgba(167, 139, 250, 0.35) !important;
  max-width: 560px;
}
.guide-title {
  font-size: calc(15px * var(--fs));
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-primary);
}
.guide-intro {
  font-size: calc(13px * var(--fs));
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 12px;
}
.guide-intro code {
  background: rgba(167,139,250,0.15);
  padding: 1px 6px;
  border-radius: 5px;
  color: #C4B5FD;
  font-family: 'Helvetica Neue', monospace;
  font-size: 0.95em;
}
.guide-examples {
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: 12px;
}
.guide-example {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 9px 12px;
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(167,139,250,0.22) !important;
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.18s;
  text-align: left;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
}
.guide-example:hover {
  background: rgba(167,139,250,0.18);
  border-color: rgba(167,139,250,0.55) !important;
  transform: translateX(2px);
}
.guide-example-label {
  font-size: calc(12.5px * var(--fs));
  color: var(--text-primary);
  font-weight: 600;
}
.guide-example code {
  font-size: calc(11px * var(--fs));
  color: #C4B5FD;
  background: transparent;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  opacity: 0.85;
}
.guide-filter-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 14px;
  background: linear-gradient(135deg, #8B5CF6, #A78BFA);
  border: none !important;
  border-radius: 10px;
  color: white;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  font-size: calc(13px * var(--fs));
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(167,139,250,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
  transition: all 0.2s;
}
.guide-filter-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(167,139,250,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
}
.guide-filter-btn:active { transform: translateY(0) scale(0.98); }

/* Mensajes — proporción más natural */
.message {
  display: flex; gap: 10px;
  max-width: 88%;
  animation: msgIn 0.3s ease-out;
}
.message.user { align-self: flex-end; flex-direction: row-reverse; }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(13px * var(--fs));
}
.message.bot .msg-avatar {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
  box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
}
.message.user .msg-avatar {
  background: rgba(30, 41, 59, 0.8);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
}

.msg-bubble {
  background: rgba(21, 35, 58, 0.85);
  border: 1px solid var(--border-color) !important;
  padding: 11px 15px;
  border-radius: 14px;
  font-size: calc(13.5px * var(--fs));
  line-height: 1.55;
  word-wrap: break-word;
  overflow-wrap: break-word;
  white-space: pre-wrap;
  max-width: 100%;
  color: var(--text-primary);
}
.message.bot .msg-bubble {
  border-top-left-radius: 4px;
}
.message.user .msg-bubble {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-color: var(--primary) !important;
  color: white;
  border-top-right-radius: 4px;
}

.msg-bubble b, .msg-bubble strong { font-weight: 700; color: var(--text-primary); }
.message.user .msg-bubble b { color: white; }
.msg-bubble i, .msg-bubble em { font-style: italic; color: var(--text-secondary); }
.message.user .msg-bubble i, .message.user .msg-bubble em { color: rgba(255,255,255,0.85); }
.msg-bubble code {
  background: rgba(15, 23, 42, 0.7);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: calc(12.5px * var(--fs));
  color: var(--secondary);
}
.message.user .msg-bubble code {
  background: rgba(255,255,255,0.15);
  color: white;
}
.msg-bubble pre {
  background: rgba(15, 23, 42, 0.7);
  padding: 10px 12px;
  border-radius: 8px;
  overflow-x: auto;
  font-family: 'Courier New', monospace;
  font-size: calc(12.5px * var(--fs));
  margin: 6px 0;
  border: 1px solid var(--border-color);
}
.msg-bubble a {
  color: #60A5FA;
  text-decoration: none;
  border-bottom: 1px dotted #60A5FA;
}
.msg-bubble a:hover { border-bottom-style: solid; }
.message.user .msg-bubble a { color: white; border-bottom-color: rgba(255,255,255,0.6); }

/* Typing indicator */
.typing {
  display: flex; gap: 5px;
  padding: 6px 4px;
}
.typing span {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--primary);
  animation: bounce 1.2s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-7px); opacity: 1; }
}

.error-banner {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #FCA5A5;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: calc(13px * var(--fs));
  display: flex; align-items: center; gap: 10px;
  animation: msgIn 0.3s ease-out;
}
.error-banner i { font-size: calc(14px * var(--fs)); }

/* Composer (input area) */
.composer {
  padding: 14px 20px 16px;
  background: rgba(15, 23, 42, 0.5);
  border-top: 1px solid var(--border-color);
  flex-shrink: 0;
}
.composer-inner {
  width: 100%;
  max-width: 1500px; margin: 0 auto;
  display: flex; gap: 10px; align-items: flex-end;
}
.composer-input-wrap {
  flex: 1;
  background: rgba(30, 41, 59, 0.8);
  border: 1px solid var(--border-color) !important;
  border-radius: 10px;
  padding: 10px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.composer-input-wrap:focus-within {
  border-color: var(--primary) !important;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}
#message-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  font-size: calc(14px * var(--fs));
  resize: none;
  max-height: 150px;
  min-height: 24px;
  line-height: 1.45;
}
#message-input::placeholder { color: var(--text-secondary); }

.send-btn {
  width: 42px; height: 42px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border: none;
  color: white;
  cursor: pointer;
  font-size: calc(15px * var(--fs));
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}
.send-btn:hover:not(:disabled) {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
}
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ============================================================
   MODAL DE FILTROS
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(6px);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: modalFadeIn 0.18s ease;
}
.modal-overlay.active { display: flex; }
@keyframes modalFadeIn {
  from { opacity: 0; } to { opacity: 1; }
}

.modal-panel {
  background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
  border: 1px solid rgba(59, 130, 246, 0.4) !important;
  border-radius: 16px;
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
              0 0 40px rgba(59, 130, 246, 0.15);
  animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
}
.modal-header h3 {
  font-size: calc(18px * var(--fs)); font-weight: 700;
  color: var(--text-primary);
  display: flex; align-items: center; gap: 10px;
}
.modal-header h3 i { color: var(--primary); font-size: calc(18px * var(--fs)); }

.modal-close {
  width: 36px; height: 36px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3) !important;
  border-radius: 8px;
  color: var(--danger);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-size: calc(14px * var(--fs));
}
.modal-close:hover {
  background: var(--danger); color: white;
  transform: rotate(90deg);
}

.modal-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
}

.filter-section { margin-bottom: 20px; }
.filter-section:last-child { margin-bottom: 0; }

/* Info box (modal sin filtros) */
.info-box {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  background: rgba(59, 130, 246, 0.08);
  border: 1px solid rgba(59, 130, 246, 0.25);
  border-left: 3px solid var(--primary) !important;
  border-radius: 8px;
  color: var(--text-primary);
  font-size: calc(14px * var(--fs));
  line-height: 1.55;
}
.info-box i {
  color: var(--primary);
  font-size: calc(18px * var(--fs));
  flex-shrink: 0;
  margin-top: 2px;
}
body.girly-mode .info-box {
  background: rgba(186, 143, 255, 0.08);
  border-color: rgba(186, 143, 255, 0.25);
  border-left-color: #BA8FFF !important;
}
body.girly-mode .info-box i { color: #BA8FFF; }

.filter-label {
  display: flex; align-items: center; gap: 8px;
  font-size: calc(13px * var(--fs)); font-weight: 700;
  color: var(--text-primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.filter-label i { color: var(--primary); font-size: calc(13px * var(--fs)); }

.filter-hint {
  font-size: calc(12px * var(--fs));
  color: var(--text-secondary);
  margin-top: 6px;
  font-style: italic;
}
.filter-hint code {
  background: rgba(59, 130, 246, 0.15);
  color: var(--primary);
  padding: 1px 6px;
  border-radius: 3px;
  font-family: 'Courier New', monospace;
  font-size: calc(11px * var(--fs));
  font-style: normal;
}

.quick-dates {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 12px;
}
.quick-dates button {
  padding: 8px 12px;
  background: rgba(30, 41, 59, 0.6);
  border: 1px solid var(--border-color) !important;
  border-radius: 6px;
  color: var(--text-secondary);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  font-size: calc(12px * var(--fs)); font-weight: 600;
  cursor: pointer;
  transition: all 0.18s;
}
.quick-dates button:hover {
  background: rgba(59, 130, 246, 0.15);
  border-color: var(--primary) !important;
  color: var(--primary);
}
.quick-dates button.active {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-color: var(--primary) !important;
  color: white;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
}

.date-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.date-field label {
  display: block;
  font-size: calc(11px * var(--fs));
  color: var(--text-secondary);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.date-field input[type="date"],
.filter-section input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid var(--border-color) !important;
  border-radius: 8px;
  color: var(--text-primary);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  font-size: calc(14px * var(--fs));
  transition: border-color 0.2s;
}
.date-field input[type="date"] { color-scheme: dark; }
.date-field input[type="date"]:focus,
.filter-section input[type="text"]:focus {
  outline: none;
  border-color: var(--primary) !important;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}
.filter-section input[type="text"]::placeholder {
  color: var(--text-secondary);
  opacity: 0.7;
}

.modal-footer {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 16px 24px;
  border-top: 1px solid var(--border-color);
}
.btn-primary, .btn-secondary {
  padding: 12px 20px;
  border-radius: 8px;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  font-size: calc(14px * var(--fs)); font-weight: 600;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.2s;
  border: 1px solid transparent !important;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: white;
  border-color: var(--primary) !important;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
}
.btn-secondary {
  background: transparent;
  color: var(--text-secondary);
  border-color: var(--border-color) !important;
}
.btn-secondary:hover {
  background: rgba(148, 163, 184, 0.1);
  color: var(--text-primary);
}

body.girly-mode .modal-panel {
  background: linear-gradient(135deg, #1a0b2e 0%, #0f0520 100%);
  border-color: rgba(186, 143, 255, 0.5) !important;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
              0 0 40px rgba(186, 143, 255, 0.2);
}
body.girly-mode .modal-header h3 i,
body.girly-mode .filter-label i,
body.girly-mode .filter-hint code { color: #BA8FFF; }
body.girly-mode .quick-dates button.active,
body.girly-mode .btn-primary {
  background: linear-gradient(135deg, #8B5CF6, #BA8FFF);
  border-color: #BA8FFF !important;
}
body.girly-mode .quick-dates button:hover {
  border-color: #BA8FFF !important;
  color: #BA8FFF;
}
body.girly-mode .filter-section input:focus,
body.girly-mode .date-field input:focus {
  border-color: #BA8FFF !important;
  box-shadow: 0 0 0 3px rgba(186, 143, 255, 0.2);
}

@media (max-width: 480px) {
  /* Modal estilo bottom-sheet: anclado abajo, más cómodo para el pulgar */
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal-panel {
    max-width: 100%;
    max-height: 92vh; max-height: 92dvh;
    border-radius: 18px 18px 0 0;
    border-bottom: none !important;
    animation: sheetUp 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .modal-header { padding: 16px 18px; }
  .modal-header h3 { font-size: calc(16px * var(--fs)); }
  .modal-body { padding: 16px 18px; }
  .modal-footer {
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    position: sticky; bottom: 0;
    background: rgba(15, 23, 42, 0.95);
  }
  .modal-footer .btn-primary, .modal-footer .btn-secondary { flex: 1; justify-content: center; }
  .date-inputs { grid-template-columns: 1fr; }
  .quick-dates { gap: 7px; }
  .quick-dates button { font-size: calc(12px * var(--fs)); padding: 9px 12px; flex: 1 1 auto; }
  /* iOS hace zoom al enfocar inputs <16px; forzamos 16px FIJO (sin calc/var
     porque iOS Safari a veces no evalúa el calc a tiempo y termina haciendo
     zoom de todos modos). 16px es el mínimo absoluto. */
  .date-field input[type="date"],
  .filter-section input[type="text"],
  #message-input { font-size: 16px !important; }
}
@keyframes sheetUp {
  from { opacity: 0.4; transform: translateY(100%); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   MOBILE MENU
   ============================================================ */
.mobile-menu-btn {
  display: none;
  position: fixed;
  /* Respetar el notch/dynamic island/barra de status del iPhone */
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: calc(env(safe-area-inset-left, 0px) + 14px);
  z-index: 300;
  width: 42px; height: 42px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border: none !important;
  color: white; font-size: calc(17px * var(--fs)); cursor: pointer;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
  transition: all 0.3s;
  align-items: center; justify-content: center;
}
.mobile-menu-btn:active { transform: scale(0.93); }
body.girly-mode .mobile-menu-btn {
  background: linear-gradient(135deg, #8B5CF6, #BA8FFF);
  box-shadow: 0 4px 12px rgba(186, 143, 255, 0.5);
}

/* Overlay oscuro detrás del sidebar abierto (solo móvil) */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  /* Negro semi-transparente sólido. SIN blur: cuando lo tenía, el sidebar
     se veía borroso aun siendo opaco porque el blur de esta capa afectaba
     toda la composición en algunos navegadores. */
  background: rgba(0, 0, 0, 0.65);
  z-index: 150;
  animation: modalFadeIn 0.2s ease;
}
@media (min-width: 769px) {
  .sidebar-overlay, .sidebar-overlay.active { display: none !important; }
}

/* ============================================================
   TABLEROS DE CATEGORÍAS — reemplazan el sidebar.
   Aparecen en el welcome-card, debajo del composer y arriba de
   los atajos rápidos. Cada tablero abre el modal de subcomandos.
   ============================================================ */
.tableros-header {
  display: flex; align-items: center; justify-content: flex-start;
  margin: 22px 0 12px;
  width: 100%;
}
.tableros-label {
  font-size: calc(11px * var(--fs));
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-secondary);
}
.tableros-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  width: 100%;
  margin-bottom: 8px;
}
.tablero {
  position: relative;
  background: linear-gradient(180deg, rgba(28, 105, 212, 0.10), rgba(21, 35, 58, 0.65));
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 16px 14px;
  text-align: left;
  cursor: pointer;
  color: var(--text-primary);
  transition: background 0.18s, border-color 0.18s, transform 0.18s;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column; gap: 4px;
  min-height: 90px;
}
.tablero:hover {
  background: linear-gradient(180deg, rgba(28, 105, 212, 0.18), rgba(27, 43, 71, 0.85));
  border-color: var(--border-strong);
  transform: translateY(-1px);
}
.tablero:active {
  background: var(--primary-soft);
  border-color: var(--primary);
  transform: translateY(0);
}
.tablero-icon {
  font-size: calc(26px * var(--fs));
  line-height: 1;
  margin-bottom: 4px;
}
.tablero-titulo {
  font-size: calc(15px * var(--fs));
  font-weight: 700;
  line-height: 1.2;
}
.tablero-sub {
  font-size: calc(11px * var(--fs));
  font-weight: 300;
  color: var(--text-secondary);
  line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Modal de subcomandos — reutiliza .modal-overlay y .modal-panel ya
   definidos arriba para mantener animación y backdrop consistentes.
   Solo añadimos la grilla de subcomandos. */
.subcomandos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}
.subcomando {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  cursor: pointer;
  color: var(--text-primary);
  transition: background 0.15s, border-color 0.15s, transform 0.15s;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.subcomando:hover {
  background: var(--primary-soft);
  border-color: var(--primary);
  transform: translateY(-1px);
}
.subcomando i {
  width: 22px; text-align: center;
  color: var(--primary);
  font-size: calc(15px * var(--fs));
}
.subcomando span {
  font-size: calc(13.5px * var(--fs));
  font-weight: 700;
}

@media (max-width: 768px) {
  .tableros-grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .tablero {
    min-height: 80px;
    padding: 14px 12px;
  }
  .subcomandos-grid {
    grid-template-columns: 1fr;
    gap: 8px;
  }
}

@media (max-width: 768px) {
  /* MÓVIL: tipografía ~15% más chica que en escritorio. Con --fs:1.35 todo
     se veía gigantesco en pantallas chicas (rompía línea innecesariamente,
     burbujas con padding excesivo). Ahora --fs:1.15 deja un tamaño cómodo
     sin desperdiciar espacio horizontal. */
  :root { --fs: 1.15; }

  .mobile-menu-btn { display: flex; }

  /* Burbujas más anchas y con menos padding para que no rompan línea. */
  .message { max-width: 96%; gap: 8px; }
  .msg-bubble { padding: 10px 13px; }

  /* En móvil la página NO hace scroll: el alto se fija al viewport dinámico
     y solo .chat-main scrollea internamente. Así el composer queda SIEMPRE
     visible abajo, sin tener que bajar a buscarlo. */
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    position: fixed; width: 100%;
  }
  /* Sidebar — selector ESPECÍFICO para ganarle al base que tiene
     backdrop-filter: blur(20px). Sin selector específico, Safari iOS
     a veces ignora el !important en backdrop-filter. */
  body .sidebar,
  .sidebar {
    transform: translateX(-100%);
    width: 300px;
    /* Sólido y sin blur — coincide con la paleta azul navy del resto */
    background: #15233A !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    box-shadow: 8px 0 24px rgba(0, 0, 0, 0.5);
    z-index: 200;
    /* 100dvh respeta correctamente la barra dinámica de iOS Safari (a
       diferencia de 100vh que incluye la barra del navegador). */
    height: 100dvh;
    max-height: 100dvh;
    /* Padding superior con safe-area para que el contenido del sidebar
       no quede pegado al notch/barra de status del iPhone. */
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  .sidebar.active { transform: translateX(0); }
  .sidebar-overlay.active { display: block; }
  .main-content { margin-left: 0 !important; padding-top: 0 !important; }

  /* Topbar compacto: deja sitio al botón hamburguesa sin desperdiciar altura.
     El padding-left abre hueco para el botón, y el margin-top respeta el
     notch del iPhone. */
  .topbar {
    margin: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;
    padding: 10px 14px 10px 74px;
    border-radius: 12px;
  }
  .topbar-left { gap: 10px; }
  .topbar-left h2 { font-size: calc(15px * var(--fs)); line-height: 1.2; }
  .topbar-left p { font-size: calc(11px * var(--fs)); }
  .bot-avatar { width: 34px; height: 34px; font-size: calc(15px * var(--fs)); }

  /* Chat ocupa todo el espacio restante; composer queda pegado abajo */
  .chat-frame { margin: 0 8px 8px; border-radius: 12px; }
  .chat-main { padding: 14px 12px; }
  .chat-container { gap: 12px; }

  .composer { padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); }
  .composer-inner { gap: 8px; }
  .send-btn { width: 42px; height: 42px; flex-shrink: 0; }

  .suggestions { grid-template-columns: 1fr 1fr; gap: 10px; max-width: 100%; }
  .suggestion { padding: 12px 13px; min-height: 64px; }
  .suggestion .sg-icon { width: 40px; height: 40px; border-radius: 11px; }
  /* Subtítulo en 2 líneas si no cabe, en vez de cortarse con "..." */
  .suggestion .sg-sub {
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .welcome-card { padding: 14px 10px 10px; }
  .welcome-avatar {
    width: 60px; height: 60px;
    margin: 0 auto 10px;
    font-size: calc(28px * var(--fs));
  }
  .welcome-emoji { font-size: calc(34px * var(--fs)); margin-bottom: 6px; }
  .welcome-title { font-size: calc(17px * var(--fs)); margin-bottom: 2px; }
  .welcome-subtitle { font-size: calc(11px * var(--fs)); margin-bottom: 12px; }
  #composer-slot-welcome { margin-bottom: 14px; }
  /* .message, .msg-avatar y .msg-bubble se definen al inicio del media query */

  /* Ayuda accesible: en vez de ocultarla, la dejamos como ícono compacto */
  .topbar-actions { display: flex; }
  .topbar-actions .topbar-btn { padding: 8px 10px; font-size: 0; gap: 0; }
  .topbar-actions .topbar-btn i { font-size: calc(15px * var(--fs)); }
}

/* ============================================================
   GIRLY MODE (mismo patrón que la intranet)
   ============================================================ */
body.girly-mode {
  background: linear-gradient(135deg, #0a0015 0%, #1a0b2e 50%, #0f0520 100%) !important;
}
body.girly-mode .sidebar {
  background: rgba(10, 0, 21, 0.85) !important;
  border-color: rgba(139, 92, 246, 0.5) !important;
  box-shadow: 0 0 30px rgba(139, 92, 246, 0.3) !important;
}
body.girly-mode .topbar,
body.girly-mode .chat-frame {

  border-color: rgba(186, 143, 255, 0.5) !important;
}
body.girly-mode .particle {
  background: rgba(186, 143, 255, 0.8);
  box-shadow: 0 0 6px rgba(186, 143, 255, 0.8);
}
body.girly-mode .bot-avatar,
body.girly-mode .message.bot .msg-avatar,
body.girly-mode .nav-item.active,
body.girly-mode .send-btn,
body.girly-mode .message.user .msg-bubble {
  background: linear-gradient(135deg, #8B5CF6, #BA8FFF) !important;
  box-shadow: 0 4px 12px rgba(186, 143, 255, 0.4) !important;
}
body.girly-mode .message.user .msg-bubble {
  border-color: #BA8FFF !important;
}
body.girly-mode .topbar-btn {
  background: rgba(186, 143, 255, 0.1);
  border-color: #BA8FFF !important;
  color: #BA8FFF;
}
/* Separadores y títulos del sidebar en modo Girly — púrpura coherente */
body.girly-mode .nav-section {
  border-image: linear-gradient(
    90deg,
    transparent 0%,
    rgba(186, 143, 255, 0.25) 20%,
    rgba(186, 143, 255, 0.25) 80%,
    transparent 100%
  ) 1;
}
body.girly-mode .nav-title {
  border-left-color: #BA8FFF !important;
  background: linear-gradient(
    90deg,
    rgba(186, 143, 255, 0.12) 0%,

    transparent 100%
  ) !important;
}
body.girly-mode .topbar-btn:hover {
  background: #BA8FFF; color: white;
  box-shadow: 0 4px 12px rgba(186, 143, 255, 0.4);
}
body.girly-mode .composer-input-wrap:focus-within {
  border-color: #BA8FFF !important;
  box-shadow: 0 0 0 3px rgba(186, 143, 255, 0.2);
}
body.girly-mode .suggestion:hover {
  background: rgba(186, 143, 255, 0.15);
  border-color: #BA8FFF !important;
  box-shadow: 0 4px 12px rgba(186, 143, 255, 0.2);
}
body.girly-mode .suggestion i,
body.girly-mode .live-indicator-value,
body.girly-mode .nav-item:hover {
  color: #BA8FFF;
}
body.girly-mode .nav-item:hover {
  background: rgba(186, 143, 255, 0.1);
}
body.girly-mode .live-indicator {

  border-left-color: #BA8FFF;
}
body.girly-mode .status-dot {
  background: #DB7093;
  box-shadow: 0 0 8px #DB7093;
}
body.girly-mode .typing span { background: #BA8FFF; }
</style>

<body class="notranslate" translate="no">

<!-- Partículas de fondo -->
<div id="particles"></div>

<div class="app-container">

  <!-- ============================================================
       SIDEBAR ELIMINADO — ahora las categorías se muestran como
       tarjetas/tableros en el welcome-card. Cada tarjeta abre un
       modal con sus sub-comandos (ver #categoria-modal abajo).
       ============================================================ -->


  <!-- ============================================================
       MAIN CONTENT — chat
       ============================================================ -->
  <main class="main-content">

      <div class="topbar-left">
        <div class="bot-avatar">
          <i class="fas fa-robot"></i>
        </div>

          <h2>Asistente Electronics México</h2>
          <p>
            <span class="status-dot"></span>
            <span id="status-text">En línea</span>
          </p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="topbar-btn" onclick="sendMessage('ayuda')" title="Ver comandos">
          <i class="fas fa-circle-info"></i>
          Ayuda
        </button>
      </div>
    </div>

    <!-- Chat frame -->
    <div class="chat-frame">
      <div class="chat-main" id="chat-main">

            <!-- Slot donde aterriza el composer en pantalla de bienvenida -->
            <div id="composer-slot-welcome"></div>

            <!-- ============================================================
                 TABLEROS DE CATEGORÍAS (antes sidebar)

                 ============================================================ -->
            <div class="tableros-header">

              <button class="tablero" onclick="abrirCategoria('inventario')">

                <div class="tablero-sub">Stock · Ventas · Traslados</div>
              </button>
              <button class="tablero" onclick="abrirCategoria('checador')">
                <div class="tablero-icon">⏰</div>
                <div class="tablero-titulo">Checador</div>
                <div class="tablero-sub">Asistencia · Bono · Faltas</div>
              </button>
              <button class="tablero" onclick="abrirCategoria('precios')">

                      autofocus></textarea>

            <i class="fas fa-paper-plane"></i>

  </main>
</div>

<!-- ============================================================
     MODAL DE FILTROS — se usa para los botones del sidebar
     ============================================================ -->
<!-- ============================================================
     MODAL DE CATEGORÍAS — abierto al tocar un tablero del welcome.
     Contiene los sub-comandos de la categoría tocada (Stock, Ventas,
     Asistencia, etc.). Reutiliza la estructura visual del modal de
     filtros para mantener consistencia.
     ============================================================ -->
<div class="modal-overlay" id="modal-categoria" onclick="cerrarCategoriaBackdrop(event)">

   Reglas críticas para construir comandos válidos:
   - Cuando hay RANGO de fechas: usar separador " al " ("01/05/2026 al 31/05/2026").

function fmtPeriodo(f) {
  // Devuelve la parte del periodo lista para concatenar al comando.
  // Si las dos fechas son iguales → "DD/MM/YYYY" (única). Si son distintas → "DD/MM/YYYY al DD/MM/YYYY".
  if (!f.fechaIni || !f.fechaFin) return '';
  if (f.fechaIni === f.fechaFin) return f.fechaIni;
  return f.fechaIni + ' al ' + f.fechaFin;
}

/* ============================================================
   LISTA DE EMPLEADOS — fetch & cache (1 hora)
   ============================================================ */
const EMPLEADOS_CACHE_KEY = 'em-bot-empleados';
const EMPLEADOS_TTL_MS = 60 * 60 * 1000; // 1 hora
let _empleadosCache = null;

async function obtenerEmpleados() {
  if (_empleadosCache) return _empleadosCache;

  // Intentar leer del localStorage
  try {
    const raw = localStorage.getItem(EMPLEADOS_CACHE_KEY);
    if (raw) {
      const stored = JSON.parse(raw);
      if (stored.ts && (Date.now() - stored.ts) < EMPLEADOS_TTL_MS) {
        _empleadosCache = stored.empleados || [];
        return _empleadosCache;
      }
    }
  } catch(e) {}

  // Refrescar desde el Worker
  try {
    const r = await fetch(WORKER_EMPLEADOS_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    _empleadosCache = data.empleados || [];
    localStorage.setItem(EMPLEADOS_CACHE_KEY,
      JSON.stringify({ ts: Date.now(), empleados: _empleadosCache }));
    return _empleadosCache;
  } catch(e) {
    console.warn('No se pudieron cargar empleados:', e.message);
    return [];
  }
}

/* ============================================================
   MODAL DE FILTROS — abrir, prefill, cerrar, ejecutar
   ============================================================ */
let _comandoActivo = null;

function fechaISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}

function fechaDDMM(iso) {
  // 2026-05-15 → 15/05/2026
  const p = iso.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}

function rangoQuick(quick) {
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const ini = new Date(hoy);
  const fin = new Date(hoy);

  switch (quick) {
    case 'hoy':
      // sin cambio
      break;
    case 'ayer':
      ini.setDate(ini.getDate() - 1);
      fin.setDate(fin.getDate() - 1);
      break;
    case 'manana':
      ini.setDate(ini.getDate() + 1);
      fin.setDate(fin.getDate() + 1);
      break;
    case 'esta-semana':
      // Lunes a domingo de esta semana
      const diaSem = hoy.getDay() || 7; // 0=domingo → 7
      ini.setDate(hoy.getDate() - (diaSem - 1));
      fin.setTime(ini.getTime());
      fin.setDate(ini.getDate() + 6);
      break;
    case 'semana-siguiente':
      // Lunes a domingo de la PRÓXIMA semana
      const diaSemS = hoy.getDay() || 7; // 0=domingo → 7
      ini.setDate(hoy.getDate() - (diaSemS - 1) + 7);
      // fin = ini + 6 días (derivado de ini para no cruzar mal de mes)
      fin.setTime(ini.getTime());
      fin.setDate(ini.getDate() + 6);
      break;
    case 'este-mes':
      ini.setDate(1);
      fin.setMonth(fin.getMonth() + 1, 0); // último día del mes
      break;
    case 'mes-siguiente':
      // Mes COMPLETO siguiente (día 1 al último día)
      ini.setMonth(ini.getMonth() + 1, 1);
      // fin = último día del mes de ini (mes+1, día 0 = último del mes anterior)
      fin.setTime(ini.getTime());
      fin.setMonth(ini.getMonth() + 1, 0);
      break;
    case 'mes-pasado':
      ini.setMonth(ini.getMonth() - 1, 1);
      fin.setMonth(fin.getMonth(), 0); // último día del mes pasado
      break;
    case 'quincena-actual':
      if (hoy.getDate() <= 15) {
        ini.setDate(1);
        fin.setDate(15);
      } else {
        ini.setDate(16);
        fin.setMonth(fin.getMonth() + 1, 0);
      }
      break;
  }
  return { ini: fechaISO(ini), fin: fechaISO(fin) };
}

function aplicarQuickDate(quick) {
  const r = rangoQuick(quick);
  document.getElementById('fecha-ini').value = r.ini;
  document.getElementById('fecha-fin').value = r.fin;
  // Toggle active state
  document.querySelectorAll('.quick-dates button').forEach(b => {
    b.classList.toggle('active', b.dataset.quick === quick);
  });
}

async function abrirFiltros(comandoId) {
  const cfg = COMANDOS[comandoId];
  if (!cfg) { console.warn('Comando no configurado:', comandoId); return; }

  _comandoActivo = comandoId;
  cerrarSidebarSiMobile();

  // Título y ícono
  document.getElementById('modal-titulo').innerHTML =
    '<i class="fas ' + cfg.icono + '"></i><span>' + cfg.titulo + '</span>';

  // Mostrar/ocultar secciones según el comando
  const showFechas   = !!cfg.filtros.fechas;
  const showEmpleado = !!cfg.filtros.empleado;
  const showSku      = !!cfg.filtros.sku;
  const sinFiltros   = !showFechas && !showEmpleado && !showSku;

  document.getElementById('seccion-fechas').style.display   = showFechas   ? '' : 'none';
  document.getElementById('seccion-empleado').style.display = showEmpleado ? '' : 'none';
  document.getElementById('seccion-sku').style.display      = showSku      ? '' : 'none';

  // Botones de fecha A FUTURO (semana/mes siguiente): solo en módulos
  // que tengan datos futuros (ej. vacaciones). En el resto se ocultan.
  const mostrarFuturo = !!cfg.filtros.fechasFuturo;
  document.querySelectorAll('.quick-dates button[data-futuro]').forEach(b => {
    b.style.display = mostrarFuturo ? '' : 'none';
  });

  // Banner "sin filtros" cuando no hay nada que filtrar (bono/retardos)
  const seccionInfo = document.getElementById('seccion-info');
  if (seccionInfo) {
    if (sinFiltros) {
      seccionInfo.style.display = '';
      const infoTexto = document.getElementById('info-texto');
      if (infoTexto) infoTexto.textContent =
        'Esta consulta no requiere filtros. Trae el periodo completo cargado en el sistema.';
    } else {
      seccionInfo.style.display = 'none';
    }
  }

  // Prefill fechas con MES ACTUAL si aplica
  if (showFechas) aplicarQuickDate('este-mes');

  // Limpiar empleado
  if (showEmpleado) {
    document.getElementById('empleado-input').value = '';
    const labelEl = document.querySelector('#seccion-empleado .filter-label span');
    if (labelEl) labelEl.textContent = cfg.filtros.empleadoOpcional
      ? 'Empleado (opcional)' : 'Empleado';
  }

  // SKU con label personalizado
  if (showSku) {
    document.getElementById('sku-input').value = '';
    const labelEl = document.querySelector('#seccion-sku .filter-label span');
    if (labelEl) labelEl.textContent = cfg.filtros.skuLabel || 'Búsqueda';
    const hintEl = document.querySelector('#seccion-sku .filter-hint');
    if (hintEl) hintEl.innerHTML = cfg.filtros.skuHint ||
      'Ej: <code>4699</code>, <code>AMA-</code>, <code>walmart</code>';
  }

  // Label de fechas (opcional vs obligatorio)
  if (showFechas) {
    const labelEl = document.querySelector('#seccion-fechas .filter-label span');
    if (labelEl) labelEl.textContent = cfg.filtros.fechasOpcional
      ? 'Periodo (opcional)' : 'Periodo';
  }

  // Si necesita empleado, asegurar que la lista esté cargada
  if (showEmpleado) {
    const hint = document.getElementById('empleado-hint');
    hint.textContent = 'Cargando lista...';
    obtenerEmpleados().then(emps => {
      const dl = document.getElementById('empleados-dl');
      dl.innerHTML = emps.map(n => '<option value="'+n.replace(/"/g,'&quot;')+'">').join('');
      hint.textContent = emps.length
        ? emps.length + ' empleados · escribe para buscar (déjalo vacío para todos)'
        : '(no se pudo cargar la lista)';
    });
  }

  // Mostrar modal y enfocar primer input
  const modal = document.getElementById('modal-filtros');
  modal.classList.add('active');

  setTimeout(() => {
    if (showSku)         document.getElementById('sku-input').focus();
    else if (showEmpleado) document.getElementById('empleado-input').focus();
    else if (showFechas) document.getElementById('fecha-ini').focus();
  }, 200);
}

function cerrarFiltros() {
  document.getElementById('modal-filtros').classList.remove('active');
  _comandoActivo = null;
}

function cerrarFiltrosBackdrop(ev) {
  // Solo cerrar si se clickeó fuera del panel (en el overlay)
  if (ev.target === ev.currentTarget) cerrarFiltros();
}

function consultarConFiltros() {
  if (!_comandoActivo) return;
  const cfg = COMANDOS[_comandoActivo];
  if (!cfg) return;

  const filtros = {};

  // FECHAS — solo recolectar si la sección está visible
  if (cfg.filtros.fechas) {
    const ini = document.getElementById('fecha-ini').value;
    const fin = document.getElementById('fecha-fin').value;
    const obligatorio = !cfg.filtros.fechasOpcional;

    if (ini && fin) {
      if (ini > fin) {
        alert('La fecha "Desde" no puede ser mayor que "Hasta".');
        return;
      }
      filtros.fechaIni = fechaDDMM(ini);
      filtros.fechaFin = fechaDDMM(fin);
    } else if (obligatorio) {
      alert('Selecciona el periodo de fechas.');
      return;
    }
  }

  if (cfg.filtros.empleado) {
    filtros.empleado = document.getElementById('empleado-input').value.trim();
  }

  if (cfg.filtros.sku) {
    filtros.sku = document.getElementById('sku-input').value.trim();
  }

  // Validar campos requeridos
  if (cfg.requiere) {
    for (const campo of cfg.requiere) {
      if (!filtros[campo]) {
        alert('Debes llenar el campo de búsqueda.');
        return;
      }
    }
  }

  const comando = cfg.build(filtros).trim().replace(/\s+/g, ' ');
  cerrarFiltros();
  sendMessage(comando);
}

// Bind de quick dates
document.querySelectorAll('.quick-dates button').forEach(b => {
  b.addEventListener('click', () => aplicarQuickDate(b.dataset.quick));
});

// ESC para cerrar
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const m = document.getElementById('modal-filtros');
    if (m && m.classList.contains('active')) cerrarFiltros();
  }
});

// Enter en inputs del modal → consultar
['sku-input','empleado-input','fecha-ini','fecha-fin'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      consultarConFiltros();
    }
  });
});

/* ============================================================
   PWA: BOTÓN INSTALAR
   ============================================================ */
let deferredInstallPrompt = null;
const btnInstalar = document.getElementById('btn-instalar');

window.addEventListener('beforeinstallprompt', (e) => {
  // Chrome dispara este evento cuando la app es instalable
  e.preventDefault();
  deferredInstallPrompt = e;
  if (btnInstalar) btnInstalar.style.display = 'flex';
});

function instalarApp() {
  if (!deferredInstallPrompt) {
    // Fallback: explicar manualmente (iOS / Safari no soporta beforeinstallprompt)
    alert('Para instalar:\n\n📱 iPhone/iPad (Safari): toca el botón Compartir y luego "Añadir a pantalla de inicio"\n\n💻 Chrome/Edge: busca el ícono ⊕ en la barra de direcciones\n\n📲 Android: menú ⋮ → "Instalar aplicación"');
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then((choice) => {
    if (choice.outcome === 'accepted') {
      console.log('✅ App instalada');
      if (btnInstalar) btnInstalar.style.display = 'none';
    }
    deferredInstallPrompt = null;
  });
}

// En iOS Safari no existe beforeinstallprompt; mostramos el botón siempre que
// la página NO esté corriendo ya como standalone (es decir, no está instalada)
const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const yaInstalada = window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true;
if (esIOS && !yaInstalada && btnInstalar) {
  btnInstalar.style.display = 'flex';
}

// Si se acaba de instalar, ocultar el botón
window.addEventListener('appinstalled', () => {
  if (btnInstalar) btnInstalar.style.display = 'none';
  deferredInstallPrompt = null;
});

/* ============================================================
   SHORTCUTS DEL MANIFEST — ?q=... ejecuta el comando al cargar
   ============================================================ */
function procesarQueryParam() {
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  if (q && q.trim()) {
    // Esperar a que el chat esté listo
    setTimeout(() => sendMessage(q.trim()), 300);
    // Limpiar la URL para que no se repita al recargar
    history.replaceState({}, '', window.location.pathname);
  }
}
function generarParticulas() {
  const container = document.getElementById('particles');
  if (!container) return;
  const count = window.innerWidth < 768 ? 20 : 40;
  const anims = ['floatOrganic1', 'floatOrganic2', 'floatOrganic3'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animation = anims[i % 3] + ' ' + (15 + Math.random() * 15) + 's linear infinite';
    p.style.animationDelay = (Math.random() * 15) + 's';
    container.appendChild(p);
  }
}

/* ============================================================
   HELPERS DE RENDERIZADO
   ============================================================ */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Sanitiza HTML del bot — solo tags whitelist (parse_mode HTML de Telegram)
function sanitizeBotHtml(html) {
  let safe = escapeHtml(html);
  safe = safe
    .replace(/&lt;(\/?(?:b|strong|i|em|u|s|code|pre|br))&gt;/gi, '<$1>')
    .replace(/&lt;a\s+href=&quot;([^&"]*)&quot;&gt;/gi, '<a href="$1" target="_blank" rel="noopener">')
    .replace(/&lt;\/a&gt;/gi, '</a>');
  return safe;
}

function scrollToBottom() {
  requestAnimationFrame(() => { chatMain.scrollTop = chatMain.scrollHeight; });
}

function autoResize() {
  messageInput.style.height = 'auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
}

/* ============================================================
   POSICIÓN DEL COMPOSER — arriba en welcome, abajo al chatear
   ============================================================ */
function posicionarComposer(modo) {
  // modo: 'welcome' (en la pantalla inicial) | 'bottom' (al chatear)
  const inner    = document.getElementById('composer-inner');
  const slotWel  = document.getElementById('composer-slot-welcome');
  const composer = document.getElementById('composer-bottom');
  if (!inner || !slotWel || !composer) return;

  // Preservar el foco del input si lo tenía antes de mover el nodo. Sin esto,
  // mover el DOM del composer hace que el navegador pierda el foco, y en iOS
  // a veces el input queda "muerto" (no responde al tap, no abre el teclado).
  const inputTeniaFoco = (document.activeElement === messageInput);

  if (modo === 'welcome') {
    if (inner.parentElement !== slotWel) slotWel.appendChild(inner);
    composer.classList.add('hidden');
    document.body.classList.add('composer-on-top');
  } else {
    if (inner.parentElement !== composer) composer.appendChild(inner);
    composer.classList.remove('hidden');
    document.body.classList.remove('composer-on-top');
  }

  // Restaurar foco después de mover si lo tenía
  if (inputTeniaFoco && messageInput) {
    // En iOS Safari el focus() inmediato después de un appendChild a veces no
    // dispara el teclado. Lo retrasamos al siguiente frame para que el
    // navegador termine de procesar el cambio del DOM.
    requestAnimationFrame(function() { messageInput.focus(); });
  }
}

function hideWelcome() {
  if (welcomeCard) welcomeCard.style.display = 'none';
  posicionarComposer('bottom');
  detenerAutoRefresh();
}

function addUserMessage(text) {
  hideWelcome();

}

function addErrorBanner(errMsg) {

/* ============================================================
   LLAMADA AL BOT
   ============================================================ */
async function sendMessage(text) {
  if (!text || !text.trim()) return;
  text = text.trim();

  cerrarSidebarSiMobile();
  addUserMessage(text);
  messageInput.value = '';
  autoResize();
  sendBtn.disabled = true;
  statusText.textContent = 'Procesando...';

  addTypingIndicator();

  try {
    const r = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session: SESSION_ID, user: 'Web' })
    });

    removeTypingIndicator();

    if (!r.ok) {
      const errText = await r.text().catch(() => '');
      addErrorBanner('Error ' + r.status + (errText ? ': ' + errText.slice(0, 200) : ''));
      return;
    }

    const data = await r.json();
    const messages = data.messages || [];

    if (messages.length === 0) {
      addBotMessage('<i>Sin respuesta del bot.</i>');
    } else {
      messages.forEach(m => addBotMessage(m));
    }
  } catch (e) {
    removeTypingIndicator();
    addErrorBanner('No se pudo conectar con el bot: ' + e.message);
  } finally {
    sendBtn.disabled = false;
    statusText.textContent = 'En línea';
    if (window.innerWidth > 768) messageInput.focus();
  }
}

    if (c.id !== 'welcome-card') c.remove();

  renderAtajos();
  posicionarComposer('welcome');
  autoRefreshAtajos();
  if (window.innerWidth > 768) messageInput.focus();
}

function enfocarInput() {
  cerrarSidebarSiMobile();
  if (window.innerWidth > 768) messageInput.focus();
}

function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderAtajos(animar) {
  const cont = document.getElementById('suggestions');
  if (!cont) return;
  // Barajar (Fisher-Yates)
  const pool = POOL_ATAJOS.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const n = window.innerWidth <= 768 ? 12 : 20;
  const sel = pool.slice(0, n);

  // Si se pidió animar (botón manual o autorefresh), hacer fade-out → fade-in
  if (animar) {
    cont.style.transition = 'opacity 0.22s';
    cont.style.opacity = '0';
    const btn = document.getElementById('refresh-atajos-btn');
    if (btn) {
      btn.classList.add('spinning');
      setTimeout(() => btn.classList.remove('spinning'), 600);
    }
    setTimeout(() => {
      renderAtajosHTML(cont, sel);
      cont.style.opacity = '1';
    }, 220);
  } else {
    renderAtajosHTML(cont, sel);
  }
}

function renderAtajosHTML(cont, sel) {
  cont.innerHTML = sel.map(a => {
    const tipo = a.type || 'query';
    const data = tipo === 'guide'
      ? 'data-guide="'+escAttr(a.id)+'"'
      : 'data-q="'+escAttr(a.q)+'"';
    const cls = tipo === 'guide' ? 'suggestion suggestion-guide' : 'suggestion';
    return '<button class="'+cls+'" '+data+'>'+
      '<span class="sg-icon"><i class="fas '+a.icon+'"></i></span>'+
      '<span class="sg-text">'+
        '<span class="sg-title">'+escAttr(a.title)+'</span>'+
        '<span class="sg-sub">'+escAttr(a.sub)+'</span>'+
      '</span>'+
    '</button>';
  }).join('');
  // Enganchar clics: guías → mostrarGuia, queries → sendMessage
  cont.querySelectorAll('.suggestion').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.guide)    mostrarGuia(b.dataset.guide);
      else if (b.dataset.q)   sendMessage(b.dataset.q);
    });
  });
}

/* ============================================================
   AUTOREFRESH — regenera atajos cada 10s mientras estás en la
   pantalla de bienvenida. Se pausa al chatear, al estar en otra
   pestaña, o si el usuario está tocando una tarjeta (hover/foco).
   ============================================================ */
let _autoRefreshTimer = null;

function autoRefreshAtajos() {
  detenerAutoRefresh();
  _autoRefreshTimer = setInterval(() => {
    // No refrescar si la pestaña está oculta
    if (document.hidden) return;
    // No refrescar si el welcome no está visible (ya chateamos)
    const wc = document.getElementById('welcome-card');
    if (!wc || wc.style.display === 'none') return;
    // No refrescar si el usuario tiene el cursor sobre algún atajo
    const cont = document.getElementById('suggestions');
    if (cont && cont.matches(':hover')) return;
    renderAtajos(true);
  }, 10000);
}

function detenerAutoRefresh() {
  if (_autoRefreshTimer) {
    clearInterval(_autoRefreshTimer);
    _autoRefreshTimer = null;
  }
}

/* ============================================================
   GUÍAS — pinta un mensaje del bot con explicación + ejemplos
   ============================================================ */
function mostrarGuia(id) {
  const g = GUIAS[id];
  if (!g) return;
  hideWelcome();   // entra al modo chat (composer abajo)

  // Construir burbuja del bot con ejemplos clickeables
  const msg = document.createElement('div');
  msg.className = 'message bot';

  let html = '<div class="msg-avatar"><i class="fas fa-robot"></i></div>'+
             '<div class="msg-bubble guide-bubble">'+
               '<div class="guide-title">'+g.titulo+'</div>'+
               '<div class="guide-intro">'+g.intro+'</div>'+
               '<div class="guide-examples">';
  g.ejemplos.forEach(ej => {
    html += '<button class="guide-example" data-q="'+escAttr(ej.cmd)+'">'+
              '<span class="guide-example-label">'+escAttr(ej.label)+'</span>'+
              '<code>'+escAttr(ej.cmd)+'</code>'+
            '</button>';
  });
  html += '</div>';
  if (g.filtroId) {
    html += '<button class="guide-filter-btn" data-filtro="'+escAttr(g.filtroId)+'">'+
              '<i class="fas fa-sliders"></i> '+escAttr(g.filtroLabel || 'Abrir filtros')+
            '</button>';
  }
  html += '</div>';
  msg.innerHTML = html;
  chatContainer.appendChild(msg);

  // Enganchar clics dentro de la guía
  msg.querySelectorAll('.guide-example').forEach(b => {
    b.addEventListener('click', () => sendMessage(b.dataset.q));
  });
  const btnFiltro = msg.querySelector('.guide-filter-btn');
  if (btnFiltro) {
    btnFiltro.addEventListener('click', () => abrirFiltros(btnFiltro.dataset.filtro));
  }
  scrollToBottom();
}

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener('load', () => {
  generarParticulas();
  aplicarGirlyGuardado();
  actualizarReloj();
  setInterval(actualizarReloj, 1000);
  renderAtajos();
  posicionarComposer('welcome');
  autoRefreshAtajos();
  procesarQueryParam();
  // Precargar empleados en background para que el modal abra rápido
  obtenerEmpleados();
  if (window.innerWidth > 768) messageInput.focus();
});
</script>
